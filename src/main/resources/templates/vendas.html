<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Vendas</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

</head>

<body>

<h1>Cadastro de Vendas</h1>

<div class="linha">

    <!-- CADASTRO -->

    <div class="bloco">

        <h2>Cadastro</h2>

        <form th:action="@{/vendas/salvar}"
              method="post">

            <label>Produto</label>

            <input type="text"
                   name="produto"
                   required>

            <label>Plataforma</label>

            <input type="text"
                   name="plataforma"
                   required>

            <label>Valor (R$)</label>

            <input type="number"
                   name="valor"
                   step="0.01"
                   required>

            <label>Data</label>

            <input type="date"
                   name="dataVenda"
                   required>

            <div class="botoes">

                <button type="submit">
                    Cadastrar
                </button>

                <a th:href="@{/vendas}">
                    <button type="button">
                        Listar
                    </button>
                </a>

            </div>

        </form>

    </div>


    <!-- PESQUISA -->

    <div class="bloco">

        <h2>Pesquisar</h2>

        <!-- PESQUISA POR PRODUTO -->

        <form th:action="@{/vendas/buscar/produto}"
              method="get">

            <label>Produto</label>

            <input type="text"
                   name="produto">

            <button type="submit">
                Buscar Produto
            </button>

        </form>


        <!-- PESQUISA POR PLATAFORMA -->

        <form th:action="@{/vendas/buscar/plataforma}"
              method="get">

            <label>Plataforma</label>

            <input type="text"
                   name="plataforma">

            <button type="submit">
                Buscar Plataforma
            </button>

        </form>


        <!-- PESQUISA POR DATA -->

        <form th:action="@{/vendas/buscar/data}"
              method="get">

            <label>Data</label>

            <input type="date"
                   name="data">

            <button type="submit">
                Buscar Data
            </button>

        </form>

    </div>

</div>


<br>

<hr>


<!-- LISTAGEM -->

<h2>Vendas Cadastradas</h2>

<table>

    <thead>

    <tr>

        <th>ID</th>
        <th>Produto</th>
        <th>Plataforma</th>
        <th>Valor</th>
        <th>Data</th>
        <th>Ação</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="venda : ${vendas}">

        <td th:text="${venda.id}">
            1
        </td>

        <td th:text="${venda.produto}">
            Produto
        </td>

        <td th:text="${venda.plataforma}">
            Plataforma
        </td>

        <td th:text="${venda.valor}">
            0.00
        </td>

        <td th:text="${venda.dataVenda}">
            01/01/2026
        </td>

        <td>

            <a th:href="@{/vendas/excluir/{id}(id=${venda.id})}"
               onclick="return confirm('Deseja excluir esta venda?')">

                <button type="button"
                        class="excluir">

                    Excluir

                </button>

            </a>

        </td>

    </tr>

    </tbody>

</table>


<br>

<div class="menu-inferior">

    <a th:href="@{/}">

        <button type="button">
            Menu
        </button>

    </a>

</div>

</body>

</html>
